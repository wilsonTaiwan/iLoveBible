<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>約瑟糧倉分糧網頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F2ECDC;
    --paper-soft: #EAE2CC;
    --ink: #2A261C;
    --ink-soft: #5A5344;
    --indigo: #1F3350;
    --indigo-dark: #17263D;
    --gold: #C79A3E;
    --gold-deep: #A87C25;
    --burgundy: #7A2A32;
    --line: #D8CDAE;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
    font-size: 17px;
  }

  h1, h2{
    font-family: "Noto Serif TC", serif;
    color: var(--indigo);
    margin: 0;
  }

  a{ color: inherit; }

  .page{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ---------- Header ---------- */
  .site-header{
    padding: 40px 0 28px;
    border-bottom: 3px solid var(--gold);
    margin-bottom: 40px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon{
    flex: none;
    width: 34px;
    height: 34px;
    color: var(--gold-deep);
  }

  .brand h1{
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .verse{
    margin: 14px 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-style: normal;
  }

  /* ---------- Primary resource card ---------- */
  .primary-resource{
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.6s ease-out forwards;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .primary-resource{ animation: none; opacity: 1; transform: none; }
  }

  .primary-card{
    background: var(--indigo);
    border-left: 6px solid var(--gold);
    border-radius: 4px;
    padding: 32px;
    color: #F4EFE1;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: 0 10px 30px rgba(23, 38, 61, 0.25);
  }

  .primary-icon{
    flex: none;
    width: 52px;
    height: 52px;
    color: var(--gold);
  }

  .primary-text{ flex: 1; min-width: 0; }

  .primary-kicker{
    margin: 0 0 6px;
    font-size: 0.9rem;
    color: #C9B98A;
  }

  .primary-text h2{
    color: #FBF8EF;
    font-size: 1.3rem;
    margin-bottom: 8px;
  }

  .primary-desc{
    margin: 0;
    color: #D9D2BC;
    font-size: 0.95rem;
  }

  .primary-btn{
    flex: none;
    display: inline-block;
    background: var(--gold);
    color: #2A2109;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 6px;
    white-space: nowrap;
    transition: background-color 0.15s ease;
  }

  .primary-btn:hover{ background: #D8AC54; }

  @media (max-width: 560px){
    .primary-card{ flex-direction: column; align-items: flex-start; }
    .primary-btn{ align-self: stretch; text-align: center; }
  }

  /* ---------- Links section ---------- */
  .links-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }

  .links-header h2{ font-size: 1.2rem; }

  .links-section{ margin-bottom: 8px; }
  .links-section > .links-grid{ margin-top: 20px; }

  .links-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }

  .link-card{
    display: block;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  a.link-card:hover{
    border-color: var(--gold-deep);
    background: #F0E6C8;
  }

  .link-card .link-name{
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .link-card .link-url{
    display: block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Footer ---------- */
  .site-footer{
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3C8 3 4.5 4.2 3 5.5V18c1.5-1.1 4.7-2 9-2s7.5.9 9 2V5.5C19.5 4.2 16 3 12 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 3v13" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <h1>約瑟糧倉分糧網頁</h1>
    </div>
    <p class="verse">「祢的話是我腳前的燈，是我路上的光。」——詩篇 119:105</p>
  </header>

  <main>
    <section class="primary-resource" aria-labelledby="primary-title">
      <div class="primary-card">
        <svg class="primary-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11l2 2h5.5c.8 0 1.5.7 1.5 1.5V18c0 .8-.7 1.5-1.5 1.5h-13C4.7 19.5 4 18.8 4 18V5.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <div class="primary-text">
          <p class="primary-kicker">聖經各卷書．簡報與圖片</p>
          <h2 id="primary-title">研讀聖經材料資料夾</h2>
          <p class="primary-desc">收錄歷卷聖經書卷的簡報與圖片，存放在共用的雲端資料夾裡，隨時可以查閱、下載。</p>
        </div>
        <a class="primary-btn" href="https://drive.google.com/drive/folders/1RtDT8NKIpusjAlxth_5OdY7fn3CnUS3v?usp=sharing" target="_blank" rel="noopener noreferrer">開啟資料夾</a>
      </div>
    </section>

    <section class="links-section">
      <div class="links-header">
        <h2>其他實用連結</h2>
      </div>
      <div id="linksGrid" class="links-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>由屬靈工人小組整理與維護．歡迎弟兄姊妹自由取用</p>
  </footer>

</div>

<script>
(function(){
  // 管理員專用：若要新增或修改連結，請直接在此陣列中增刪
  var DEFAULT_LINKS = [
    { name: '生命詩歌作者檢索網頁', url: 'https://gemini.google.com/share/f3558b84647c' },
    { name: '出埃及記鳥瞰_建造帳幕的異象', url: 'https://drive.google.com/file/d/1-aKeqKaG0oLvoDmbcJ6HqUtoFk_zxgNc/view?usp=drive_link' },
    { name: 'Blue Letter Bible 原文字義工具', url: 'https://www.blueletterbible.org/' }
  ];

  var grid = document.getElementById('linksGrid');

  function render(){
    grid.innerHTML = '';

    DEFAULT_LINKS.forEach(function(link){
      if (!link.url) return; // 忽略沒有網址的項目

      var card = document.createElement('a');
      card.className = 'link-card';
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      var n = document.createElement('span');
      n.className = 'link-name';
      n.textContent = link.name;

      var u = document.createElement('span');
      u.className = 'link-url';
      u.textContent = link.url;

      card.appendChild(n);
      card.appendChild(u);
      grid.appendChild(card);
    });
  }

  // 網頁載入時直接渲染連結清單
  render();
})();
</script>
</body>
</html>
